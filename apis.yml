description: 'Planet FWD is a decarbonization software platform that helps consumer
  brands measure, reduce, and report their carbon emissions. It provides AI-powered
  product life cycle assessments (LCAs), corporate greenhouse-gas inventories across
  Scope 1, 2, and 3, and supply-chain decarbonization scenario planning for food &
  beverage, retail, and apparel companies. Surfaced as a portfolio company of Cowboy
  Ventures and profiled in the API Evangelist network; no public developer API surface
  was found at enrichment time.'
